<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Arbeitszeit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbeitszeit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar"><h1 id="title">Arbeitszeit</h1><span id="status" class="status"></span></header>
  <div id="banner"></div>
  <main id="view"></main>
  <nav class="tabbar" id="tabs">
    <button data-tab="monat" class="tab"><span class="ico">📅</span>Monat</button>
    <button data-tab="konto" class="tab"><span class="ico">⏱️</span>Konto</button>
    <button data-tab="einstellungen" class="tab"><span class="ico">⚙️</span>Einstellungen</button>
  </nav>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status"></div>
<noscript>Diese App benötigt JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
